name: altodevmobile
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.1.4
  pointycastle: ^4.0.0
  basic_utils: ^5.8.2
  flutter_secure_storage: ^10.0.0
  dio: ^5.9.1
  go_router: ^17.1.0
  flutter_riverpod: ^3.2.1
  pretty_qr_code: ^3.6.0
  flutter_launcher_icons: ^0.14.4
  uuid: 4.5.3
  forui: ^0.17.0
  image_picker: ^1.2.1
  package_info_plus: ^9.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png

  fonts:
    - family: Patrick Hand
      fonts:
        - asset: fonts/PatrickHand-Regular.ttf
